{% extends "base.html" %}

{% block title %}Mood Quiz - Mood Map{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    .quiz-wrapper {
        max-width: 800px;
        margin: 4rem auto;
        padding: 0 20px;
        width: 100%;
    }
    .quiz-card {
        background: var(--white);
        padding: 3rem;
        border-radius: var(--border-radius);
        box-shadow: var(--shadow);
        text-align: center;
    }
    .quiz-card h3 {
        font-size: 1.8rem;
        margin-bottom: 2rem;
        color: var(--primary-color);
    }
    .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin-bottom: 2.5rem;
    }
    .option-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.5rem;
        border: 2px solid #eee;
        border-radius: var(--border-radius);
        cursor: pointer;
        transition: var(--transition);
        gap: 1rem;
    }
    .option-box:hover {
        border-color: var(--primary-light);
        background: rgba(106, 90, 205, 0.05);
    }
    .option-box.selected {
        border-color: var(--primary-color);
        background: rgba(106, 90, 205, 0.1);
    }
    .option-box img {
        width: 60px;
        height: 60px;
    }
    .quiz-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
    }
    .nav-btn {
        background: var(--primary-color);
        color: white;
        border: none;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: var(--transition);
        font-size: 1.2rem;
    }
    .nav-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
    }
    .nav-btn:hover:not(:disabled) {
        background: var(--primary-dark);
        transform: scale(1.1);
    }
    .btn-submit-quiz {
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 0.8rem 2rem;
        border-radius: 50px;
        font-weight: 600;
        cursor: pointer;
        display: none;
    }
    
    @media (max-width: 600px) {
        .options-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="quiz-wrapper animate-fade">
    <div class="quiz-card quiz-container">
        <h3>Loading Question...</h3>
        <div id="options" class="options-grid">
            <!-- Options will be loaded here -->
        </div>
        
        <div class="quiz-nav">
            <button class="nav-btn fa-arrow-left" id="prev-btn" title="Previous">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <button class="btn-submit-quiz" id="final-submit-btn">Submit Quiz</button>
            
            <button class="nav-btn fa-arrow-right" id="next-btn" title="Next">
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='Scripts/quizScript.js') }}"></script>
<script>
    // Adjusting the script to work with the new IDs/Classes if necessary
    // The quizScript.js uses document.querySelector(".fa-arrow-left") etc.
    // I kept those classes on the buttons.
</script>
{% endblock %}
