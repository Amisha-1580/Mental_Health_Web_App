{% extends "base.html" %}

{% block title %}Login - Mood Map{% endblock %}

{% block content %}
<div class="split-layout animate-fade">
    <div class="hero-content">
        <h1>WELCOME BACK</h1>
        <p>Log in to continue your journey. Your mental health data is safe and secure with us.</p>
        <p>Check in with yourself today.</p>
        <a href="/quiz" class="hero-cta">TAKE A QUIZ</a>
    </div>

    <div class="auth-card">
        <h2>Login</h2>
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="/signup">Sign Up</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
