{% extends "base.html" %}

{% block title %}Quiz Results - Mood Map{% endblock %}

{% block head %}
<style>
    .result-wrapper {
        max-width: 900px;
        margin: 4rem auto;
        padding: 0 20px;
        width: 100%;
    }
    .result-header {
        text-align: center;
        margin-bottom: 3rem;
    }
    .result-header h2 {
        font-size: 2.5rem;
        color: var(--primary-color);
    }
    .result-card {
        background: var(--white);
        border-radius: var(--border-radius);
        box-shadow: var(--shadow);
        padding: 3rem;
        display: flex;
        flex-direction: column;
        gap: 3rem;
    }
    .score-summary {
        display: flex;
        justify-content: space-around;
        align-items: center;
        border-bottom: 1px solid #eee;
        padding-bottom: 3rem;
    }
    .score-item {
        text-align: center;
    }
    .score-item span {
        display: block;
        font-size: 1.2rem;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
    }
    .score-item .score {
        font-size: 3.5rem;
        font-weight: 700;
        color: var(--primary-color);
    }
    .grade-box {
        text-align: center;
    }
    .grade-box span {
        font-size: 2rem;
        font-weight: 600;
        color: var(--text-color);
        display: block;
        margin-bottom: 1rem;
    }
    .grade-box img {
        width: 100px;
        height: 100px;
    }
    .suggestions-section h2 {
        font-size: 1.8rem;
        margin-bottom: 2rem;
        color: var(--text-color);
        text-align: left;
    }
    .tips {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 2rem;
    }
    .tip {
        background: var(--bg-color);
        padding: 1.5rem;
        border-radius: var(--border-radius);
        text-align: center;
        transition: var(--transition);
    }
    .tip:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    .tip p {
        font-weight: 600;
        margin-bottom: 1rem;
        color: var(--text-color);
    }
    .tip img {
        width: 100%;
        max-width: 200px;
        height: 150px;
        object-fit: cover;
        border-radius: 8px;
    }
    .chatbot-fab {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 70px;
        height: 70px;
        background: var(--primary-color);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(106, 90, 205, 0.4);
        transition: var(--transition);
        z-index: 1000;
    }
    .chatbot-fab:hover {
        transform: scale(1.1) rotate(10deg);
        background: var(--primary-dark);
    }
    .chatbot-fab img {
        width: 40px;
        height: 40px;
        filter: brightness(0) invert(1);
    }
</style>
{% endblock %}

{% block content %}
<div class="result-wrapper animate-fade">
    <div class="result-header">
        <h2>Your Mental Health Tracker</h2>
    </div>

    <div class="result-card">
        <div class="score-summary">
            <div class="score-item">
                <span>Your Score</span>
                <div class="score">0/10</div>
            </div>
            <div class="grade-box">
                <span>Assessment...</span>
                <img src="{{ url_for('static', filename='images/simple_smiley.png') }}" alt="Result" class="smiley">
            </div>
        </div>

        <div class="suggestions-section">
            <h2>Recommended Tips for You</h2>
            <div class="tips">
                <!-- Tips will be injected by JavaScript -->
            </div>
        </div>
    </div>
</div>

<a href="/chatbot" class="chatbot-fab" title="Talk to AI Assistant">
    <img src="{{ url_for('static', filename='images/mental_chatbot.jpg') }}" alt="Chatbot">
</a>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='Scripts/resultScript.js') }}"></script>
{% endblock %}
