{% extends "base.html" %}

{% block title %}Mood Chatbot - Mood Map{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    .chatbot-wrapper {
        height: calc(100vh - 72px);
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--bg-color);
        padding: 2rem 0;
    }
    
    #chatMessages {
        flex: 1;
        width: 100%;
        max-width: 800px;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    
    .message {
        max-width: 80%;
        padding: 1rem 1.5rem;
        border-radius: 20px;
        font-size: 1rem;
        line-height: 1.5;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    
    .user-message {
        align-self: flex-end;
        background: var(--primary-color);
        color: white;
        border-bottom-right-radius: 2px;
    }
    
    .bot-message {
        align-self: flex-start;
        background: white;
        color: var(--text-color);
        border-bottom-left-radius: 2px;
        border: 1px solid #eee;
    }
    
    .chat-bar-container {
        width: 100%;
        max-width: 800px;
        padding: 1rem;
        background: white;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 1rem;
        box-shadow: var(--shadow);
        margin-top: 1rem;
    }
    
    .chat-input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 1rem;
        padding: 0.5rem;
    }
    
    .chat-btn {
        background: var(--primary-color);
        color: white;
        border: none;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: var(--transition);
    }
    
    .chat-btn:hover {
        background: var(--primary-dark);
        transform: scale(1.1);
    }
    
    .logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        margin-top: 5rem;
    }
    
    .logo-container img {
        width: 120px;
        height: 120px;
        opacity: 0.8;
    }
    
    .logo-container h2 {
        color: var(--primary-color);
        font-weight: 600;
    }
    
    .hidden { display: none; }
</style>
{% endblock %}

{% block content %}
<div class="chatbot-wrapper animate-fade">
    <div id="centerLogo" class="logo-container">
        <img src="{{ url_for('static', filename='images/main-logo.png') }}" alt="Mood Map">
        <h2>How are you feeling today?</h2>
    </div>

    <div id="chatMessages" class="hidden">
        <!-- Messages will appear here -->
    </div>

    <div class="chat-bar-container">
        <input type="text" id="userInput" class="chat-input" placeholder="Type your message here..." autocomplete="off">
        <button id="sendBtn" class="chat-btn">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userInput');
    const chatMessages = document.getElementById('chatMessages');
    const centerLogo = document.getElementById('centerLogo');

    function appendMessage(text, isUser) {
        if (centerLogo) centerLogo.classList.add('hidden');
        chatMessages.classList.remove('hidden');
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'} animate-fade`;
        msgDiv.textContent = text;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        appendMessage(message, true);
        userInput.value = '';

        try {
            const response = await fetch('/chat/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();
            appendMessage(data.reply, false);
        } catch (error) {
            console.error('Error:', error);
            appendMessage("Sorry, I'm having trouble connecting right now.", false);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
{% endblock %}
